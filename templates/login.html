{% extends "base.html" %}

{% block title %}Student Login | Smart Campus Placement{% endblock %}

{% block content %}
<div class="container">
    <div class="form-box">
        <div class="form-header">
            <h2>Student Login</h2>
            <p>Access your applications and campus placement drives</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email">Email Address <span style="color: var(--accent-rose);">*</span></label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                    value="{{ email if email else '' }}"
                >
            </div>

            <div class="form-group">
                <label for="password">Password <span style="color: var(--accent-rose);">*</span></label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="password-toggle-btn" data-target="password">Show</button>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In as Student</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--slate-200); font-size: 0.95rem; color: var(--slate-600);">
            <p>New to the portal? <a href="{{ url_for('register') }}" style="font-weight: 600;">Register here</a></p>
            <p style="margin-top: 10px;">
                Placement Officer? <a href="{{ url_for('admin_login') }}" style="color: var(--primary-600); font-weight: 600;">Admin Login &rarr;</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
